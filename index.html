<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Qual personagem de Ordem Paranormal você seria?</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- TELA DO QUIZ -->

        <section id="quiz">

            <div class="topo">
                <span id="contador">Pergunta 1 de 20</span>

                <div class="barra">
                    <div id="progresso"></div>
                </div>
            </div>


            <div class="quiz-card">

                <p class="categoria">
                    ORDEM PARANORMAL
                </p>

                <h1 id="pergunta">
                    Qual personagem de Ordem Paranormal você seria?
                </h1>

                <div id="alternativas"></div>

            </div>

        </section>


        <!-- RESULTADO -->

        <section id="resultado" class="escondido">

            <div class="resultado-card">

                <p class="resultado-pequeno">
                    SEU RESULTADO É...
                </p>

                <h1>AGATHA VOLKOMENN</h1>

                <img
                    id="imagemAgatha"
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQhQZVvK2G8EYXY5cmhnt0TgVnp4rb5kvwS8ILCZfYKVkcdr7pcd8jNr_hg&s=10"
                    alt="Agatha Volkomenn"
                >

                <p class="descricao">
                    Você tem uma personalidade intensa, misteriosa
                    e impossível de ignorar.
                </p>

                <p class="espera">
                    Analisando resultado...
                </p>

            </div>

        </section>


        <!-- JUMPSCARE -->

        <section id="jumpscare">

            <img
                id="imagemSusto"
                src="https://bird-x.com/wp-content/uploads/spider-closeup.jpg"
                alt=""
            >

        </section>


        <!-- TELA DO HELL NAH -->

        <section id="finalTroll">

            <div class="troll-card">

                <img
                    src="https://www.reddit.com/media?url=https%3A%2F%2Fpreview.redd.it%2Fessa-foto-do-paquet%25C3%25A9-%25C3%25A9-muito-resenha-v0-logwu7ixdgqg1.jpg%3Fwidth%3D640%26crop%3Dsmart%26auto%3Dwebp%26s%3Dcdcaf77ea63797a355c6e15d88940b80d32b7a77"
                    alt="Paquetá"
                >

                <h1>
                    dnv menina q lê ? KKKKKKKKKK
                </h1>

            </div>

        </section>


        <!-- ÁUDIOS -->

        <audio
            id="audioSusto"
            src="fears-to-fathom-jumpscare.mp3"
            preload="auto">
        </audio>

        <audio
            id="audioHell"
            src="oh-my-god-bro-oh-hell-nah-man.mp3"
            preload="auto">
        </audio>

    </main>


    <script src="script.js"></script>

</body>
</html>
